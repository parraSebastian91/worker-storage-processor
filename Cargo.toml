[package]
name = "worker-storage-processor"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "worker-storage-processor"
path = "cmd/api/main.rs"

# Laboratorio para probar y ajustar la lectura del timbre contra facturas
# reales, sin levantar RabbitMQ ni el pipeline completo.
[[bin]]
name = "lab-timbre"
path = "cmd/lab_timbre/main.rs"
required-features = ["timbre"]

[features]
default = []
ocr = ["dep:pdfium-render", "dep:tesseract"]
# Lectura del timbre electrónico (PDF417/TED). Separada de `ocr` a propósito:
# `ocr` arrastra tesseract y pdfium, que son librerías nativas del sistema, y
# sin esta separación no se podría iterar sobre el timbre fuera de Docker.
timbre = ["dep:rxing", "dep:rsa", "dep:sha1"]

[dependencies]
# Async Runtime
tokio = { version = "1.40", features = ["full"] }
async-trait = "0.1"
futures-lite = "2.3"
axum = "0.7"

# Mensajería
lapin = "2.5"

# Serialización
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Configuración
config = "0.14"
dotenvy = "0.15"

# Logging y Observabilidad
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

# HTTP Client
reqwest = { version = "0.11", features = ["json"] }

# Manejo de errores
thiserror = "1.0"
anyhow = "1.0"

# Utilidades
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.21"
bytes = "1"
regex = "1"

# Redis
redis = { version = "0.24", features = ["tokio-comp", "connection-manager"] }

# Storage
minio = "0.3.0"

# Database
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "macros", "json"] }

# Image processor
image = "0.25"
fast_image_resize = "3.0"
webp = "0.3"

# OCR / PDF
pdfium-render = { version = "0.8", optional = true }
tesseract = { version = "0.15", optional = true }

# Timbre electrónico (PDF417 → TED → verificación de la firma)
rxing = { version = "0.9", optional = true }
rsa = { version = "0.9", features = ["sha1"], optional = true }
sha1 = { version = "0.10", optional = true }

[profile.release]
opt-level = 3
lto = true             # Link Time Optimization: binario más rápido pero build lento (~producción)
codegen-units = 1

# Perfil para desarrollo local y Docker en dev.
# - Sin LTO: el linker termina mucho más rápido
# - codegen-units=8: paralelismo máximo en compilación (aprovecha los 8/12 cores del Ryzen 9 y M2)
# - opt-level=2: optimizaciones razonables sin el costo de nivel 3
# Uso: cargo build --profile dev-fast
#       o en Dockerfile: --build-arg BUILD_PROFILE=dev-fast
[profile.dev-fast]
inherits = "release"
opt-level = 2
lto = false
codegen-units = 8
debug = false
panic = 'abort'        # Reduce el tamaño del binario y mejora ligeramente el rendimiento